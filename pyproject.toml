[project]
name = "wajha"
authors = [{ name = "AAA Consulting", email = "a.abdulla@aaacons.com" }]
description = "Wajha — Arabic-first, config-driven Desk shell and theming layer for Frappe/ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"
